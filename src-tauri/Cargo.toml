[package]
name = "f95-game-manager"
version = "0.1.0"
description = "Official game library, update tracker and launcher for f95api.xyz"
authors = ["F95GameManager contributors"]
edition = "2024"

[lib]
name = "f95gm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
keyring = { version = "3", features = ["windows-native"] }
thiserror = "2"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
log = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
regex = "1"
zip = "9"
sevenz-rust2 = "0.25"
unrar = "0.5"
mega = "0.8"
futures-io = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
trash = "5"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
